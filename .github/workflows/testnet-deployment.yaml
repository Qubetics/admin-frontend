name: '[testnet] Deploy User admin Frontend'

on: 
  push:
    branches: 
      - testnet

jobs:
  solver-onboarding-backend:
    uses: Qubetics/argocd-qubetics/.github/workflows/deployment.yaml@testnet
    with:
      SWR_ORGANIZATION: testnet-qubetics
      ARGOCD_BRANCH: testnet
      HUAWEI_REGION: 'ap-southeast-3'
      ARGOCD_REPOSITORY: Qubetics/argocd-qubetics
      DEPLOYMENT_PATH: Dvpn-admin-frontend/deployment.yaml
      HUAWEI_IMAGE: dvpn-admin-frontend
      DOCKER_USERNAME: ap-southeast-3@HPUAPZMSZHNKTAIENRZO
      ENV: ${{ vars.TESTNET_DVPN_ADMIN_FRONTEND }}
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      GIT_SSH_KEY: ${{ secrets.ARGOCD_SSH_KEY }} 
