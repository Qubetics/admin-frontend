map $sent_http_content_type $expires {
    default                    off;
    text/html                  epoch;
    text/css                   max;
    application/javascript     max;
    ~image/                    max;
}

server {
    listen 3000;
    server_name localhost;
    absolute_redirect off;
    expires $expires;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        text/css
        text/html
        image/svg+xml;

    root /usr/share/nginx/html;

    location /provider/assets/ {
        try_files $uri =404;
        access_log off;
        expires max;
    }

    location /provider/ {
        index index.html;
        try_files $uri $uri/ /provider/index.html;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}